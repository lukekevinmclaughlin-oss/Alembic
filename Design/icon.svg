<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#0c1b28"/>
      <stop offset="55%" stop-color="#081220"/>
      <stop offset="100%" stop-color="#04080f"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#56e1f5" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#2bb8d9" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2bb8d9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8df2ff"/>
      <stop offset="55%" stop-color="#56e1f5"/>
      <stop offset="100%" stop-color="#1e9cc4"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd27a"/>
      <stop offset="100%" stop-color="#e09a3e"/>
    </linearGradient>
    <!-- scan sweep wedge -->
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#56e1f5" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#56e1f5" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#56e1f5" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBig" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186" ry="186"/>
    </clipPath>
    <pattern id="hex" width="72" height="63" patternUnits="userSpaceOnUse" patternTransform="translate(8,4)">
      <path d="M18 0 L54 0 L72 31.5 L54 63 L18 63 L0 31.5 Z" fill="none" stroke="#3adcf0" stroke-opacity="0.055" stroke-width="1.6"/>
    </pattern>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#hex)"/>
    <circle cx="512" cy="512" r="330" fill="url(#coreGlow)"/>

    <!-- ===== outer HUD rings ===== -->
    <!-- tick ring -->
    <circle cx="512" cy="512" r="356" fill="none" stroke="#56e1f5" stroke-opacity="0.30"
            stroke-width="10" stroke-dasharray="3 21.35"/>
    <!-- thin steady ring -->
    <circle cx="512" cy="512" r="322" fill="none" stroke="#2bb8d9" stroke-opacity="0.35" stroke-width="2.5"/>
    <!-- arc segments (rotating feel) -->
    <g filter="url(#glow)">
      <path d="M 512 190 A 322 322 0 0 1 790 350" fill="none" stroke="url(#holo)" stroke-width="9" stroke-linecap="round"/>
      <path d="M 810 610 A 322 322 0 0 1 615 818" fill="none" stroke="url(#holo)" stroke-width="9" stroke-linecap="round" stroke-opacity="0.8"/>
      <path d="M 300 760 A 322 322 0 0 1 195 570" fill="none" stroke="url(#holo)" stroke-width="9" stroke-linecap="round" stroke-opacity="0.6"/>
    </g>
    <!-- degree ticks, inner -->
    <circle cx="512" cy="512" r="284" fill="none" stroke="#56e1f5" stroke-opacity="0.22"
            stroke-width="16" stroke-dasharray="2 42.63"/>

    <!-- ===== scan sweep ===== -->
    <g transform="rotate(-38 512 512)">
      <path d="M512 512 L862 512 A350 350 0 0 0 758 265 Z" fill="url(#sweep)" filter="url(#soft)"/>
      <line x1="512" y1="512" x2="862" y2="512" stroke="#8df2ff" stroke-opacity="0.9" stroke-width="4" filter="url(#glow)"/>
    </g>

    <!-- ===== reticle brackets ===== -->
    <g stroke="#56e1f5" stroke-opacity="0.75" stroke-width="7" fill="none" stroke-linecap="round">
      <path d="M330 292 L292 292 L292 330"/>
      <path d="M694 292 L732 292 L732 330"/>
      <path d="M292 694 L292 732 L330 732"/>
      <path d="M732 694 L732 732 L694 732"/>
    </g>

    <!-- ===== central data complex (lattice being assembled) ===== -->
    <!-- edges -->
    <g stroke="#56e1f5" stroke-width="4.5" stroke-opacity="0.75" filter="url(#glow)">
      <line x1="512" y1="512" x2="512" y2="356"/>
      <line x1="512" y1="512" x2="647" y2="434"/>
      <line x1="512" y1="512" x2="647" y2="590"/>
      <line x1="512" y1="512" x2="512" y2="668"/>
      <line x1="512" y1="512" x2="377" y2="590"/>
      <line x1="512" y1="512" x2="377" y2="434"/>
      <line x1="512" y1="356" x2="647" y2="434"/>
      <line x1="647" y1="434" x2="647" y2="590"/>
      <line x1="647" y1="590" x2="512" y2="668"/>
      <line x1="512" y1="668" x2="377" y2="590"/>
      <line x1="377" y1="590" x2="377" y2="434"/>
      <line x1="377" y1="434" x2="512" y2="356"/>
    </g>
    <!-- assembly edges (dashed, incoming) -->
    <g stroke="#8df2ff" stroke-width="3.5" stroke-opacity="0.55" stroke-dasharray="10 12" stroke-linecap="round">
      <line x1="647" y1="434" x2="762" y2="380"/>
      <line x1="377" y1="590" x2="266" y2="648"/>
      <line x1="512" y1="356" x2="512" y2="262"/>
    </g>

    <!-- nodes -->
    <g filter="url(#glowBig)">
      <circle cx="512" cy="512" r="34" fill="url(#holo)"/>
      <circle cx="512" cy="512" r="14" fill="#eafcff"/>
    </g>
    <g filter="url(#glow)">
      <circle cx="512" cy="356" r="19" fill="url(#holo)"/>
      <circle cx="647" cy="434" r="19" fill="url(#holo)"/>
      <circle cx="647" cy="590" r="19" fill="url(#holo)"/>
      <circle cx="512" cy="668" r="19" fill="url(#holo)"/>
      <circle cx="377" cy="590" r="19" fill="url(#holo)"/>
      <circle cx="377" cy="434" r="19" fill="url(#amber)"/>
    </g>
    <!-- nodes still being assembled: dashed ghosts -->
    <g fill="none" stroke="#8df2ff" stroke-width="3.5" stroke-dasharray="7 8" stroke-opacity="0.8">
      <circle cx="762" cy="380" r="15"/>
      <circle cx="266" cy="648" r="15"/>
      <circle cx="512" cy="262" r="15"/>
    </g>
    <!-- amber incoming fragment -->
    <g filter="url(#glow)">
      <rect x="742" y="586" width="22" height="22" rx="6" fill="url(#amber)" opacity="0.95"/>
      <rect x="292" y="368" width="16" height="16" rx="5" fill="url(#amber)" opacity="0.8"/>
    </g>

    <!-- ===== data readout dashes (bottom) ===== -->
    <g fill="#56e1f5">
      <rect x="392" y="806" width="58" height="8" rx="4" opacity="0.85"/>
      <rect x="462" y="806" width="26" height="8" rx="4" opacity="0.55"/>
      <rect x="500" y="806" width="84" height="8" rx="4" opacity="0.75"/>
      <rect x="596" y="806" width="38" height="8" rx="4" opacity="0.45"/>
    </g>

    <!-- floating micro glyphs -->
    <g stroke="#56e1f5" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6">
      <path d="M232 452 h26 M245 439 v26"/>
      <path d="M776 686 h20 M786 676 v20"/>
    </g>
    <circle cx="716" cy="238" r="6" fill="#8df2ff" opacity="0.8"/>
    <circle cx="286" cy="786" r="5" fill="#8df2ff" opacity="0.6"/>

    <!-- top vignette sheen -->
    <ellipse cx="512" cy="150" rx="430" ry="120" fill="#8df2ff" opacity="0.05" filter="url(#soft)"/>
  </g>

  <rect x="100" y="100" width="824" height="824" rx="186" ry="186" fill="none"
        stroke="#8df2ff" stroke-opacity="0.10" stroke-width="2"/>
</svg>
